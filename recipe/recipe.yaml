schema_version: 1

context:
  version: "1.11.1"

package:
  name: alembic-postgresql-enum
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/alembic-postgresql-enum/alembic_postgresql_enum-${{ version }}.tar.gz
  sha256: 66277c112ef86c30c73e06bfb6deedd4cb62ec0a9e6017bcaee0c0d43a085f23

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - sqlalchemy >=1.4
    - alembic >=1.7

tests:
  - python:
      imports:
        - alembic_postgresql_enum
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/Pogchamp-company/alembic-postgresql-enum
  summary: Alembic autogenerate support for creation, alteration and deletion of enums
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ytausch
